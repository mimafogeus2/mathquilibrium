<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orderly — make your own level</title>
<meta name="description" content="Make your own Orderly level: a subject and ten cards in the right order. Send the link to a friend and see if they can sort it.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Games by Miki">
<meta property="og:url" content="https://mimafogeus2.github.io/mathquilibrium/orderly/editor.html">
<meta property="og:title" content="Orderly — make your own level">
<meta property="og:description" content="Make your own Orderly level: a subject and ten cards in the right order. Send the link to a friend and see if they can sort it.">
<meta property="og:image" content="https://mimafogeus2.github.io/mathquilibrium/orderly/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f3ede1">
<script src="../shared/theme.js"></script>
<script data-goatcounter="https://goatcounter-production-28ca10cd.up.railway.app/count" async src="https://goatcounter-production-28ca10cd.up.railway.app/count.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f3ede1'/%3E%3Ccircle cx='28' cy='36' r='16' fill='%2326366b'/%3E%3Ccircle cx='36' cy='28' r='16' fill='%23ffb511' fill-opacity='.88'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/core.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="editor" class="screen">
  <header class="bar">
    <div class="bar-start"><a id="btn-back" class="icon" href="./" aria-label="Back to menu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a></div>
    <div class="title"><b>Make a level</b><small>Orderly</small></div>
    <div class="bar-end"><button class="icon js-theme" aria-label="Theme"></button></div>
  </header>
  <p class="tagline e-intro">Pick a subject, write ten cards in the right order, and send the link to a friend.</p>
  <form id="e-form" class="e-form" novalidate>
    <label class="e-field"><span class="kicker">Subject</span>
      <input id="e-subject" maxlength="80" autocomplete="off" placeholder="The planets, by distance from the Sun"></label>
    <fieldset class="e-field">
      <legend class="kicker">Order, from top to bottom</legend>
      <div id="e-presets" class="e-presets"></div>
      <div class="e-ends">
        <label><span class="sr-only">Top label</span><span aria-hidden="true">▲</span><input id="e-top" maxlength="24" autocomplete="off" aria-describedby="e-ends-hint"></label>
        <button type="button" id="e-swap" class="icon" aria-label="Swap top and bottom"><svg viewBox="0 0 24 24"><path d="M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4"/></svg></button>
        <label><span class="sr-only">Bottom label</span><span aria-hidden="true">▼</span><input id="e-bottom" maxlength="24" autocomplete="off" aria-describedby="e-ends-hint"></label>
      </div>
      <small id="e-ends-hint" class="e-hint">The labels above the first card and below the last.</small>
    </fieldset>
    <div class="e-field">
      <span class="kicker">Cards, in the right order</span>
      <small class="e-hint">Players sort the names. A card's value is revealed once it's placed right.</small>
      <span id="e-lbl-top" class="end-label"></span>
      <ol id="e-list" class="e-list"></ol>
      <span id="e-lbl-bottom" class="end-label"></span>
    </div>
    <div class="e-field">
      <span class="kicker">Preview</span>
      <div class="e-preview" aria-hidden="true">
        <div class="card"><svg class="grip" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"/></svg><span class="name"></span></div>
        <div class="card ok"><svg class="grip" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"/></svg><span class="name"></span><span class="val"></span></div>
      </div>
    </div>
    <p id="e-msg" class="e-msg" aria-live="polite"></p>
    <div class="e-actions">
      <button id="e-test" class="btn primary center"><b>Test it</b></button>
      <div class="row">
        <button type="button" id="e-share" class="btn ghost center"><b>Share</b></button>
        <button type="button" id="e-copy" class="btn ghost center"><b>Copy link</b></button>
      </div>
      <button type="button" id="e-clear" class="give-up">Start over</button>
    </div>
  </form>
</main>

<script src="../shared/common.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/link.js"></script>
<script src="custom.js"></script>
<script src="editor.js"></script>
</body>
</html>
