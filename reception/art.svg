<svg xmlns="http://www.w3.org/2000/svg">
<!-- Reception's art: one symbol per thing that stands in the city. game.js puts this file into the page once and draws each with <use href="#id">.
     Every colour is a CSS variable set in style.css (day and night), so the same drawing serves both themes.
     Pieces: viewBox -50 -110 100 125, origin (0 0) = the foot of the piece on its roof; ~100 units is one square.
     Small things (roof props, trees, venues): viewBox -20 -40 40 44, origin (0 0) = where they stand.
     Things that face a way come as -s (toward you), -n (away) and -e (right; the board mirrors it for west).
     See graphics-guide.md for the full list and the colour variables. -->
<defs>
  <style>
    .a-o { stroke: var(--a-ln); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .a-t { stroke: var(--a-ln); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .a-l { fill: none; stroke: var(--a-ln); stroke-linecap: round; stroke-linejoin: round; }
    .a-s { fill: none; stroke: var(--a-k); stroke-linecap: round; stroke-linejoin: round; }  /* the blue structure plate */
    .a-c { fill: none; stroke: var(--a-hi); stroke-linecap: round; stroke-linejoin: round; } /* a highlight cut out of the ink */
    .a-l2 { fill: none; stroke: var(--a-acc); stroke-linecap: round; opacity: .7; }         /* signal arcs in the body's ink */
    .a-k1 { stroke: var(--a-ln); stroke-width: 2; stroke-linejoin: round; }                  /* the thin navy key line */
  </style>
</defs>

<!-- ========== antennae ==========
     Printed in two spot inks: blue for the structure (--a-k), the tray slot's colour for the body (--a-acc), paper (--a-hi) for the
     highlights cut out of them, and a thin navy key line (a-k1) round the main shapes only. -->
<symbol id="mast" viewBox="-50 -110 100 125" overflow="visible">
  <rect x="-27" y="-5" width="14" height="7" rx="2" style="fill:var(--a-k)"/>
  <rect x="13" y="-5" width="14" height="7" rx="2" style="fill:var(--a-k)"/>
  <path class="a-s" stroke-width="3.4" d="M-20 0 16.5-21-13-42 9.5-63-6-84M20 0-16.5-21 13-42-9.5-63 6-84M-16.5-21h33M-13-42h26M-9.5-63h19"/>
  <path class="a-s" stroke-width="7.5" d="M-20 0-6-84M20 0 6-84"/>
  <path class="a-c" stroke-width="1.8" d="M-18.3-7-7.4-74"/>
  <path class="a-s" stroke-width="3.4" d="M0-90v-22"/>
  <rect x="-18" y="-109" width="9" height="21" rx="2.5" style="fill:var(--a-wh)" class="a-k1"/>
  <rect x="9" y="-109" width="9" height="21" rx="2.5" style="fill:var(--a-wh)" class="a-k1"/>
  <rect x="-5" y="-111" width="10" height="23" rx="2.5" style="fill:var(--a-acc)" class="a-k1"/>
  <rect x="-15" y="-92" width="30" height="10" rx="3" style="fill:var(--a-acc)" class="a-k1"/>
  <path class="a-c" stroke-width="1.8" d="M-11-87h14"/>
</symbol>

